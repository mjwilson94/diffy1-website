<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a1a1a;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  textarea {
    width: 100%;
    max-width: 360px;
    min-height: 100px;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 12px;
    resize: vertical;
    box-sizing: border-box;
  }
  button {
    margin-top: 1rem;
    padding: 0.65rem 1.5rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fafaf8;
    background: #1a1a1a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #status {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #777;
  }
</style>
</head>
<body>
  <h1 id="heading">reply to the poke</h1>
  <form id="reply-form">
    <textarea id="reply-text" maxlength="500" placeholder="type your reply..."></textarea><br>
    <button id="submit-btn" type="submit">send</button>
  </form>
  <div id="status"></div>
  <script>
    const WORKER_URL = "https://diffy1-poke-worker.mjwilson94.workers.dev";
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const form = document.getElementById("reply-form");
    const textarea = document.getElementById("reply-text");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const heading = document.getElementById("heading");

    if (!id) {
      heading.textContent = "missing poke id";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const response = textarea.value.trim();
      if (!response) return;
      submitBtn.disabled = true;
      statusEl.textContent = "sending...";
      try {
        const res = await fetch(`${WORKER_URL}/reply/${id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ response }),
        });
        if (!res.ok) throw new Error("failed");
        heading.textContent = "sent ✅";
        form.style.display = "none";
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = "something went wrong, try again";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
