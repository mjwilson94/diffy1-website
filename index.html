<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diffy1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #fafaf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .emoji-line {
    display: block;
  }
  .subtext {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: #777;
    letter-spacing: 0.01em;
    margin-top: 0.75rem;
  }
  .cursor {
    display: inline-block;
    width: 1px;
    margin-left: 2px;
    background: currentColor;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <h1 id="text"><span class="cursor">&nbsp;</span></h1>
  <script>
    const line1 = "hi diffaaaaaaaaaaaay2";
    const emoji = "😘";
    const line2 = "I knew you wouldn't be able to help yourself opening";
    const line3 = "puss puss";
    const el = document.getElementById("text");
    const cursor = el.querySelector(".cursor");
    const chars1 = Array.from(line1);
    let i = 0;
    function typeLine1() {
      if (i < chars1.length) {
        cursor.insertAdjacentText("beforebegin", chars1[i]);
        i++;
        setTimeout(typeLine1, 80);
      } else {
        cursor.remove();
        const emojiSpan = document.createElement("span");
        emojiSpan.className = "emoji-line";
        emojiSpan.textContent = emoji;
        el.appendChild(emojiSpan);
        setTimeout(startLine2, 500);
      }
    }
    function startLine2() {
      const subEl = document.createElement("span");
      subEl.className = "subtext";
      el.appendChild(subEl);
      subEl.appendChild(cursor);
      const chars2 = Array.from(line2);
      let j = 0;
      function typeLine2() {
        if (j < chars2.length) {
          cursor.insertAdjacentText("beforebegin", chars2[j]);
          j++;
          setTimeout(typeLine2, 40);
        } else {
          cursor.remove();
          setTimeout(startLine3, 400);
        }
      }
      typeLine2();
    }
    function startLine3() {
      const subEl = document.createElement("span");
      subEl.className = "subtext";
      el.appendChild(subEl);
      subEl.appendChild(cursor);
      const chars3 = Array.from(line3);
      let k = 0;
      function typeLine3() {
        if (k < chars3.length) {
          cursor.insertAdjacentText("beforebegin", chars3[k]);
          k++;
          setTimeout(typeLine3, 40);
        } else {
          cursor.remove();
        }
      }
      typeLine3();
    }
    typeLine1();
  </script>
</body>
</html>
