<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .emoji-line {
    display: block;
  }
  .subtext {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: #777;
    letter-spacing: 0.01em;
    margin-top: 0.75rem;
  }
  .cursor {
    display: inline-block;
    width: 1px;
    margin-left: 2px;
    background: currentColor;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .banana {
    position: fixed;
    font-size: 2.5rem;
    top: var(--top);
    left: -3rem;
    z-index: 10;
    pointer-events: none;
    animation: poke-left var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
    animation-fill-mode: backwards;
  }
  .banana.right {
    left: auto;
    right: -3rem;
    animation-name: poke-right;
  }
  @keyframes poke-left {
    0%, 100% { left: -3rem; transform: scaleX(1); }
    50% { left: 1rem; transform: scaleX(1); }
  }
  @keyframes poke-right {
    0%, 100% { right: -3rem; transform: scaleX(-1); }
    50% { right: 1rem; transform: scaleX(-1); }
  }
  #text.clickable {
    cursor: pointer;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .tap-hint {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: #aaa;
    margin-top: 0.5rem;
    opacity: 0;
    animation: fade-in 0.4s ease forwards;
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
  .falling-banana {
    position: fixed;
    top: -3rem;
    font-size: var(--size);
    left: var(--left);
    z-index: 20;
    pointer-events: none;
    animation: fall var(--fall-duration) linear forwards;
    animation-delay: var(--fall-delay);
  }
  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(115vh) rotate(var(--spin));
      opacity: 1;
    }
  }
  #poke-wrap {
    position: fixed;
    bottom: 2rem;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #poke-btn {
    padding: 0.65rem 1.5rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fafaf8;
    background: #1a1a1a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #poke-btn:hover {
    transform: scale(1.05);
  }
  #poke-btn:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
  }
  #poke-count {
    margin-top: 0.4rem;
    font-size: 0.7rem;
    font-weight: 500;
    color: #bbb;
  }

<body>
  <span class="banana" style="--top: 15%; --duration: 3.5s; --delay: 0s;">🍌</span>
  <span class="banana right" style="--top: 30%; --duration: 4.2s; --delay: 0.6s;">🍌</span>
  <span class="banana" style="--top: 55%; --duration: 3.8s; --delay: 1.2s;">🍌</span>
  <span class="banana right" style="--top: 68%; --duration: 4.6s; --delay: 0.3s;">🍌</span>
  <span class="banana" style="--top: 82%; --duration: 4s; --delay: 1.8s;">🍌</span>
  <span class="banana right" style="--top: 10%; --duration: 3.6s; --delay: 2.1s;">🍌</span>
  <h1 id="text"><span class="cursor">&nbsp;</span></h1>
  <div id="poke-wrap">
    <button id="poke-btn" type="button">👀 poke diffaaaay1</button>
    <span id="poke-count"></span>
  </div>
  <script>
    const WORKER_URL = "https://diffy1-poke-worker.mjwilson94.workers.dev";
    fetch(`${WORKER_URL}/visit`, { method: "POST" }).catch(() => {});

    const pokeBtn = document.getElementById("poke-btn");
    const pokeCountEl = document.getElementById("poke-count");

    function renderCount(count) {
      pokeCountEl.textContent = `poked ${count} time${count === 1 ? "" : "s"}`;
    }

    fetch(`${WORKER_URL}/count`)
      .then((res) => res.json())
      .then((data) => renderCount(data.count))
      .catch(() => {});

    const POKE_COOLDOWN_MS = 3000;
    let pokeCooldown = false;
    pokeBtn.addEventListener("click", () => {
      if (pokeCooldown) return;
      pokeCooldown = true;
      pokeBtn.disabled = true;
      fetch(`${WORKER_URL}/poke`, { method: "POST" })
        .then((res) => res.json())
        .then((data) => {
          if (typeof data.count === "number") renderCount(data.count);
        })
        .catch(() => {});
      setTimeout(() => {
        pokeBtn.disabled = false;
        pokeCooldown = false;
      }, POKE_COOLDOWN_MS);
    });

    const line1 = "hi diffaaaaaaaaay2";
    const emoji = "😘";
    const line3 = "\"puss puss\"";
    const line4 = "CYA";
    const el = document.getElementById("text");
    const cursor = el.querySelector(".cursor");
    const chars1 = Array.from(line1);
    let i = 0;
    function typeLine1() {
      if (i < chars1.length) {
        cursor.insertAdjacentText("beforebegin", chars1[i]);
        i++;
        setTimeout(typeLine1, 80);
      } else {
        cursor.remove();
        const emojiSpan = document.createElement("span");
        emojiSpan.className = "emoji-line";
        emojiSpan.textContent = emoji;
        el.appendChild(emojiSpan);
        setTimeout(startLine3, 1000);
      }
    }
    function startLine3() {
      const subEl = document.createElement("span");
      subEl.className = "subtext";
      el.appendChild(subEl);
      subEl.appendChild(cursor);
      const chars3 = Array.from(line3);
      let k = 0;
      function typeLine3() {
        if (k < chars3.length) {
          cursor.insertAdjacentText("beforebegin", chars3[k]);
          k++;
          setTimeout(typeLine3, 40);
        } else {
          cursor.remove();
          setTimeout(startLine4, 2000);
        }
      }
      typeLine3();
    }
    function startLine4() {
      el.innerHTML = "";
      el.appendChild(cursor);
      const chars4 = Array.from(line4);
      let m = 0;
      function typeLine4() {
        if (m < chars4.length) {
          cursor.insertAdjacentText("beforebegin", chars4[m]);
          m++;
          setTimeout(typeLine4, 80);
        } else {
          cursor.remove();
          el.classList.add("clickable");
          const hint = document.createElement("span");
          hint.className = "tap-hint";
          hint.textContent = "psst... tap it 👆";
          el.appendChild(hint);
          el.addEventListener("click", bananaWaterfall);
        }
      }
      typeLine4();
    }

    function bananaWaterfall() {
      const count = 60;
      for (let n = 0; n < count; n++) {
        const b = document.createElement("span");
        b.className = "falling-banana";
        b.textContent = "🍌";
        b.style.setProperty("--left", `${Math.random() * 100}vw`);
        b.style.setProperty("--size", `${1.5 + Math.random() * 2}rem`);
        b.style.setProperty("--fall-duration", `${1.8 + Math.random() * 1.5}s`);
        b.style.setProperty("--fall-delay", `${Math.random() * 1.2}s`);
        b.style.setProperty("--spin", `${Math.random() > 0.5 ? 360 : -360}deg`);
        document.body.appendChild(b);
        b.addEventListener("animationend", () => b.remove());
      }
    }

    typeLine1();
  </script>
</body>
</html>
