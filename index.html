<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .emoji-line {
    display: block;
  }
  .subtext {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: #777;
    letter-spacing: 0.01em;
    margin-top: 0.75rem;
  }
  .cursor {
    display: inline-block;
    width: 1px;
    margin-left: 2px;
    background: currentColor;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .banana {
    position: fixed;
    font-size: 2.5rem;
    top: var(--top);
    left: -3rem;
    z-index: 10;
    pointer-events: none;
    animation: poke-left var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
    animation-fill-mode: backwards;
  }
  .banana.right {
    left: auto;
    right: -3rem;
    animation-name: poke-right;
  }
  @keyframes poke-left {
    0%, 100% { left: -3rem; transform: scaleX(1); }
    50% { left: 1rem; transform: scaleX(1); }
  }
  @keyframes poke-right {
    0%, 100% { right: -3rem; transform: scaleX(-1); }
    50% { right: 1rem; transform: scaleX(-1); }
  }
  #text.clickable {
    cursor: pointer;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .tap-hint {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: #aaa;
    margin-top: 0.5rem;
    opacity: 0;
    animation: fade-in 0.4s ease forwards;
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
  .falling-banana {
    position: fixed;
    top: -3rem;
    font-size: var(--size);
    left: var(--left);
    z-index: 20;
    pointer-events: none;
    animation: fall var(--fall-duration) linear forwards;
    animation-delay: var(--fall-delay);
  }
  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(115vh) rotate(var(--spin));
      opacity: 1;
    }
  }
  #poke-wrap {
    position: fixed;
    bottom: 2rem;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #poke-btn {
    padding: 0.65rem 1.5rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fafaf8;
    background: #1a1a1a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #poke-btn:hover {
    transform: scale(1.05);
  }
  #poke-btn:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
  }
  #poke-btn.success {
    background: #22c55e;
    opacity: 1;
  }
  #poke-count {
    margin-top: 0.4rem;
    font-size: 0.7rem;
    font-weight: 500;
    color: #bbb;
  }
  #note-btn {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    padding: 0.5rem 1rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: #1a1a1a;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 999px;
    cursor: pointer;
    z-index: 40;
  }
  #note-form {
    position: fixed;
    top: 4rem;
    right: 1.25rem;
    z-index: 40;
    display: none;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
  }
  #note-form.open {
    display: flex;
  }
  #note-text {
    width: 220px;
    max-width: 60vw;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.6rem;
    border: 1px solid #ddd;
    border-radius: 12px;
    resize: none;
    box-sizing: border-box;
  }
  #note-submit {
    padding: 0.45rem 1rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fafaf8;
    background: #1a1a1a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  #note-submit:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #note-from {
    font-size: 0.75rem;
    font-weight: 500;
    color: #999;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .post-it {
    position: fixed;
    width: 130px;
    padding: 0.75rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: #3a3a3a;
    box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.15);
    border-radius: 2px;
    z-index: 15;
    pointer-events: none;
    word-wrap: break-word;
    opacity: 1;
    transform: rotate(var(--rot)) scale(1);
    animation: pop-in 0.3s ease;
  }
  .post-it-from {
    font-size: 0.65rem;
    font-weight: 700;
    color: #3a3a3a;
    opacity: 0.65;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .post-it-date {
    margin-top: 0.4rem;
    font-size: 0.65rem;
    font-weight: 500;
    color: #3a3a3a;
    opacity: 0.55;
  }
  @keyframes pop-in {
    from { transform: rotate(var(--rot)) scale(0.5); }
    to { transform: rotate(var(--rot)) scale(1); }
  }
</style>
</head>
<body>
  <span class="banana" style="--top: 15%; --duration: 3.5s; --delay: 0s;">🍌</span>
  <span class="banana right" style="--top: 30%; --duration: 4.2s; --delay: 0.6s;">🍌</span>
  <span class="banana" style="--top: 55%; --duration: 3.8s; --delay: 1.2s;">🍌</span>
  <span class="banana right" style="--top: 68%; --duration: 4.6s; --delay: 0.3s;">🍌</span>
  <span class="banana" style="--top: 82%; --duration: 4s; --delay: 1.8s;">🍌</span>
  <span class="banana right" style="--top: 10%; --duration: 3.6s; --delay: 2.1s;">🍌</span>
  <h1 id="text"><span class="cursor">&nbsp;</span></h1>
  <div id="poke-wrap">
    <button id="poke-btn" type="button">👀 poke diffaaaay1</button>
    <span id="poke-count"></span>
  </div>
  <button id="note-btn" type="button">📝 leave a note</button>
  <div id="note-form">
    <span id="note-from" data-value="diffy2">from: diffy2</span>
    <textarea id="note-text" maxlength="200" rows="3" placeholder="leave a note..." data-hj-allow></textarea>
    <button id="note-submit" type="button">stick it</button>
  </div>
  <script>
    const WORKER_URL = "https://diffy1-poke-worker.mjwilson94.workers.dev";
    fetch(`${WORKER_URL}/visit`, { method: "POST" }).catch(() => {});

    const pokeBtn = document.getElementById("poke-btn");
    const pokeCountEl = document.getElementById("poke-count");
    const defaultPokeLabel = pokeBtn.textContent;

    function renderCount(count) {
      pokeCountEl.textContent = `poked diffy1 ${count} time${count === 1 ? "" : "s"}`;
    }

    function showSuccessOnButton() {
      pokeBtn.textContent = "success ✅";
      pokeBtn.classList.add("success");
      setTimeout(() => {
        pokeBtn.textContent = defaultPokeLabel;
        pokeBtn.classList.remove("success");
      }, 1000);
    }

    fetch(`${WORKER_URL}/count`)
      .then((res) => res.json())
      .then((data) => renderCount(data.count))
      .catch(() => {});

    const POKE_COOLDOWN_MS = 3000;
    let pokeCooldown = false;
    pokeBtn.addEventListener("click", () => {
      if (pokeCooldown) return;
      pokeCooldown = true;
      pokeBtn.disabled = true;
      fetch(`${WORKER_URL}/poke`, { method: "POST" })
        .then((res) => res.json())
        .then((data) => {
          if (typeof data.count === "number") renderCount(data.count);
          showSuccessOnButton();
        })
        .catch(() => {});
      setTimeout(() => {
        pokeBtn.disabled = false;
        pokeCooldown = false;
      }, POKE_COOLDOWN_MS);
    });

    const noteBtn = document.getElementById("note-btn");
    const noteForm = document.getElementById("note-form");
    const noteText = document.getElementById("note-text");
    const noteSubmit = document.getElementById("note-submit");
    const noteFrom = document.getElementById("note-from");

    noteFrom.addEventListener("dblclick", () => {
      const next = noteFrom.dataset.value === "diffy2" ? "diffy1" : "diffy2";
      noteFrom.dataset.value = next;
      noteFrom.textContent = `from: ${next}`;
    });
    const POST_IT_COLORS = ["#fff59d", "#f8bbd0", "#bbdefb", "#c8e6c9", "#ffe0b2"];
    const seenNoteIds = new Set();

    function rectsOverlap(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    function getExclusionZones() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      return [
        { left: w - 340, right: w, top: 0, bottom: 180 }, // leave-a-note button + form
        { left: w / 2 - 180, right: w / 2 + 180, top: h - 150, bottom: h }, // poke button + count
      ];
    }

    function pickNotePosition() {
      const noteW = 130;
      const noteH = 90;
      const zones = getExclusionZones();
      for (let attempt = 0; attempt < 30; attempt++) {
        const topPct = 5 + Math.random() * 80;
        const leftPct = 5 + Math.random() * 80;
        const top = (topPct / 100) * window.innerHeight;
        const left = (leftPct / 100) * window.innerWidth;
        const rect = { left, right: left + noteW, top, bottom: top + noteH };
        if (!zones.some((z) => rectsOverlap(rect, z))) {
          return { top: `${topPct}%`, left: `${leftPct}%` };
        }
      }
      return { top: "45%", left: "5%" };
    }

    function renderNote(note) {
      if (seenNoteIds.has(note.id)) return;
      seenNoteIds.add(note.id);
      const noteEl = document.createElement("div");
      noteEl.className = "post-it";
      const rot = (Math.random() * 16 - 8).toFixed(1);
      const pos = pickNotePosition();
      noteEl.style.setProperty("--rot", `${rot}deg`);
      noteEl.style.top = pos.top;
      noteEl.style.left = pos.left;
      noteEl.style.background = POST_IT_COLORS[Math.floor(Math.random() * POST_IT_COLORS.length)];

      const fromEl = document.createElement("div");
      fromEl.className = "post-it-from";
      fromEl.textContent = `From: ${note.from || "diffy2"}`;
      noteEl.appendChild(fromEl);

      const textEl = document.createElement("div");
      textEl.textContent = note.text;
      noteEl.appendChild(textEl);

      if (note.createdAt) {
        const dateEl = document.createElement("div");
        dateEl.className = "post-it-date";
        dateEl.textContent = new Date(note.createdAt).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
        noteEl.appendChild(dateEl);
      }

      document.body.appendChild(noteEl);
    }

    function loadNotes() {
      fetch(`${WORKER_URL}/notes`)
        .then((res) => res.json())
        .then((data) => {
          (data.notes || []).forEach(renderNote);
        })
        .catch(() => {});
    }
    loadNotes();
    setInterval(loadNotes, 6000);

    noteBtn.addEventListener("click", () => {
      noteForm.classList.toggle("open");
      if (noteForm.classList.contains("open")) noteText.focus();
    });

    noteSubmit.addEventListener("click", () => {
      const text = noteText.value.trim();
      if (!text) return;
      const from = noteFrom.dataset.value === "diffy1" ? "diffy1" : "diffy2";
      noteSubmit.disabled = true;
      fetch(`${WORKER_URL}/note`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, from }),
      })
        .then(() => {
          noteText.value = "";
          noteFrom.dataset.value = "diffy2";
          noteFrom.textContent = "from: diffy2";
          noteForm.classList.remove("open");
          loadNotes();
        })
        .catch(() => {})
        .finally(() => {
          noteSubmit.disabled = false;
        });
    });

    const line1 = "hi diffaaaaaaaaay2";
    const emoji = "😘";
    const line3 = "\"puss puss\"";
    const line4 = "CYA";
    const el = document.getElementById("text");
    const cursor = el.querySelector(".cursor");
    const chars1 = Array.from(line1);
    let i = 0;
    function typeLine1() {
      if (i < chars1.length) {
        cursor.insertAdjacentText("beforebegin", chars1[i]);
        i++;
        setTimeout(typeLine1, 80);
      } else {
        cursor.remove();
        const emojiSpan = document.createElement("span");
        emojiSpan.className = "emoji-line";
        emojiSpan.textContent = emoji;
        el.appendChild(emojiSpan);
        setTimeout(startLine3, 1000);
      }
    }
    function startLine3() {
      const subEl = document.createElement("span");
      subEl.className = "subtext";
      el.appendChild(subEl);
      subEl.appendChild(cursor);
      const chars3 = Array.from(line3);
      let k = 0;
      function typeLine3() {
        if (k < chars3.length) {
          cursor.insertAdjacentText("beforebegin", chars3[k]);
          k++;
          setTimeout(typeLine3, 40);
        } else {
          cursor.remove();
          setTimeout(startLine4, 2000);
        }
      }
      typeLine3();
    }
    function startLine4() {
      el.innerHTML = "";
      el.appendChild(cursor);
      const chars4 = Array.from(line4);
      let m = 0;
      function typeLine4() {
        if (m < chars4.length) {
          cursor.insertAdjacentText("beforebegin", chars4[m]);
          m++;
          setTimeout(typeLine4, 80);
        } else {
          cursor.remove();
          el.classList.add("clickable");
          const hint = document.createElement("span");
          hint.className = "tap-hint";
          hint.textContent = "psst... tap it 👆";
          el.appendChild(hint);
          el.addEventListener("click", bananaWaterfall);
        }
      }
      typeLine4();
    }

    function bananaWaterfall() {
      const count = 60;
      for (let n = 0; n < count; n++) {
        const b = document.createElement("span");
        b.className = "falling-banana";
        b.textContent = "🍌";
        b.style.setProperty("--left", `${Math.random() * 100}vw`);
        b.style.setProperty("--size", `${1.5 + Math.random() * 2}rem`);
        b.style.setProperty("--fall-duration", `${1.8 + Math.random() * 1.5}s`);
        b.style.setProperty("--fall-delay", `${Math.random() * 1.2}s`);
        b.style.setProperty("--spin", `${Math.random() > 0.5 ? 360 : -360}deg`);
        document.body.appendChild(b);
        b.addEventListener("animationend", () => b.remove());
      }
    }

    typeLine1();
  </script>
</body>
</html>
